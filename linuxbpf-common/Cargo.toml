[package]
name = "linuxbpf-common"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[dependencies]
aya = { workspace = true, optional = true }
network-types = { workspace = true }
# Only pulled in for the userspace crate (see the `user` feature below);
# needed to parse the TOML allowlist config. Kept optional so the no_std
# eBPF build never attempts to compile them (anyhow/toml aren't no_std).
anyhow = { workspace = true, optional = true, default-features = true }
serde = { workspace = true, optional = true, features = ["derive"] }
toml = { workspace = true, optional = true, default-features = true }

[dev-dependencies]
# Unconditionally available under `cargo test`, regardless of the `user`
# feature, so `config`'s tests run without needing (and without being able
# to compile) the real `aya` dependency.
anyhow = { workspace = true, default-features = true }
serde = { workspace = true, features = ["derive"] }
toml = { workspace = true, default-features = true }

[features]
default = []
# Enabled only by the userspace crate; pulls in `aya::Pod` impls for the
# shared map key/value types, plus the TOML config parser's dependencies.
# The eBPF crate builds without it (no_std, can't link any of these).
user = ["dep:aya", "dep:anyhow", "dep:serde", "dep:toml"]
