[package]
name = "linuxbpf"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[dependencies]
linuxbpf-common = { path = "../linuxbpf-common", features = ["user"] }

anyhow = { workspace = true, default-features = true }
aya = { workspace = true, default-features = true }
clap = { workspace = true }
libc = { workspace = true, default-features = true }
serde = { workspace = true, features = ["derive"] }
toml = { workspace = true, default-features = true }
tracing = { workspace = true, default-features = true }
tracing-subscriber = { workspace = true, features = ["fmt", "env-filter", "ansi"] }
tracing-journald = { workspace = true, default-features = true }
tokio = { workspace = true, features = [
    "macros",
    "rt",
    "rt-multi-thread",
    "net",
    "signal",
] }

[build-dependencies]
anyhow = { workspace = true }
aya-build = { workspace = true }
cargo_metadata = { workspace = true }
# See the comment in the upstream aya-template about why this is a regular
# path dependency (not an artifact dependency) despite building for a
# completely different target: https://github.com/aya-rs/aya-template
linuxbpf-ebpf = { path = "../linuxbpf-ebpf" }

[[bin]]
name = "linuxbpf"
path = "src/main.rs"
